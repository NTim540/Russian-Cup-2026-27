<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тест анимации удаления · Кубок России U16</title>
<style>
:root{--bg:#06111d;--panel:#0c1d30;--line:rgba(139,190,226,.16);--text:#f4f8fb;--muted:#8ea4b9;--red:#e31f2b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 70% 10%,rgba(35,135,217,.12),transparent 35%),linear-gradient(180deg,#06111d,#081522);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}button{font:inherit}.wrap{width:min(980px,calc(100% - 28px));margin:0 auto;padding:44px 0 70px}.kicker{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7dbbe4;font-weight:900}.title{margin:8px 0 8px;font-size:clamp(30px,5vw,52px);letter-spacing:-.045em;line-height:1}.sub{margin:0 0 24px;color:var(--muted);font-size:13px;line-height:1.55}.stage{border:1px solid var(--line);background:rgba(5,17,29,.7);border-radius:18px;padding:18px;box-shadow:0 30px 90px rgba(0,0,0,.28)}.event{position:relative;display:grid;grid-template-columns:92px 58px minmax(0,1fr) auto;gap:16px;align-items:center;min-height:126px;padding:18px 20px;border:1px solid rgba(139,190,226,.14);border-radius:14px;background:linear-gradient(180deg,rgba(18,40,64,.96),rgba(8,24,40,.98));overflow:hidden;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}.time strong{display:block;font-size:22px;line-height:1;font-weight:950;letter-spacing:-.03em}.time span{display:block;margin-top:7px;font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:#8095aa}.logo{width:52px;height:52px;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(0,0,0,.25))}.main{display:flex;gap:13px;align-items:center;min-width:0}.avatar{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:#102844;border:1px solid rgba(255,255,255,.08);font-size:14px;font-weight:950;color:#9ec8e5;flex:0 0 auto}.copy{min-width:0}.label{display:flex;align-items:center;gap:7px;color:#ff6671;font-size:10px;font-weight:950;letter-spacing:.11em;text-transform:uppercase;margin-bottom:5px}.label svg{width:21px;height:21px}.copy strong{display:block;font-size:17px;line-height:1.2}.copy p{margin:6px 0 0;color:#93a8bc;font-size:11px;line-height:1.45}.mins{font-size:13px;font-weight:950;color:#fff;white-space:nowrap}.controls{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:14px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:11px 15px;background:var(--red);color:#fff;font-weight:900;cursor:pointer}.hint{color:var(--muted);font-size:11px}

.penalty-layer{position:absolute;inset:0;z-index:20;background:var(--red);color:#fff;overflow:hidden;clip-path:inset(0 100% 0 0);pointer-events:none;will-change:clip-path,transform}.penalty-layer-inner{position:absolute;inset:0;display:grid;align-items:center;padding:0 32px}.penalty-phase-b{grid-template-columns:auto minmax(0,1fr);gap:24px;justify-content:center;background:var(--red)}.penalty-cover{position:absolute;inset:0;z-index:2;background:var(--red);overflow:hidden;clip-path:inset(0 0 0 0);will-change:clip-path}.penalty-phase-a{grid-template-columns:72px minmax(0,1fr) 92px;gap:20px}.whistle{width:52px;height:52px;display:grid;place-items:center}.whistle svg{width:52px;height:52px;display:block}.penalty-word{font-size:clamp(30px,5vw,58px);font-weight:1000;letter-spacing:-.045em;text-transform:uppercase;white-space:nowrap}.penalty-team-logo{width:78px;height:78px;object-fit:contain;justify-self:end;filter:drop-shadow(0 10px 20px rgba(0,0,0,.24))}.penalty-minutes{font-size:clamp(48px,7vw,82px);line-height:.8;font-weight:1000;letter-spacing:-.06em;white-space:nowrap}.penalty-reason{font-size:clamp(24px,4vw,48px);font-weight:1000;letter-spacing:-.04em;text-transform:uppercase;white-space:nowrap}
.penalty-playing>:not(.penalty-layer){animation:underCard 5.8s linear both}.penalty-playing .penalty-layer{animation:penaltyOuter 5.8s cubic-bezier(.65,0,.35,1) both}.penalty-playing .penalty-cover{animation:penaltyReverse 5.8s cubic-bezier(.65,0,.35,1) both}
@keyframes underCard{0%,73%{opacity:0}74%,100%{opacity:1}}
@keyframes penaltyOuter{0%,4%{clip-path:inset(0 100% 0 0);transform:translateY(0)}24%,74%{clip-path:inset(0 0 0 0);transform:translateY(0)}100%{clip-path:inset(0 0 0 0);transform:translateY(-102%)}}
@keyframes penaltyReverse{0%,38%{clip-path:inset(0 0 0 0)}63%,100%{clip-path:inset(0 100% 0 0)}}
.penalty-cover:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 0 38%,rgba(255,255,255,.12) 48%,transparent 58%);transform:translateX(-120%)}.penalty-playing .penalty-cover:after{animation:glint 5.8s ease both}@keyframes glint{0%,10%{transform:translateX(-120%)}31%{transform:translateX(120%)}100%{transform:translateX(120%)}}

@media(max-width:700px){.wrap{padding-top:26px}.stage{padding:10px}.event{grid-template-columns:58px 40px minmax(0,1fr);gap:9px;min-height:104px;padding:14px 11px}.time strong{font-size:17px}.logo{width:38px;height:38px}.avatar{width:48px;height:48px}.copy strong{font-size:14px}.mins{grid-column:3;justify-self:start;margin-top:-8px}.penalty-layer-inner{padding:0 16px}.penalty-phase-a{grid-template-columns:46px minmax(0,1fr) 56px;gap:9px}.whistle,.whistle svg{width:38px;height:38px}.penalty-team-logo{width:50px;height:50px}.penalty-word{font-size:clamp(21px,8vw,34px)}.penalty-phase-b{grid-template-columns:auto minmax(0,1fr);gap:10px}.penalty-minutes{font-size:40px}.penalty-reason{font-size:clamp(20px,6.5vw,30px)}}
@media(prefers-reduced-motion:reduce){.penalty-playing .penalty-layer,.penalty-playing .penalty-cover,.penalty-playing>:not(.penalty-layer){animation-duration:.01ms!important}}
</style>
</head>
<body>
<main class="wrap">
  <div class="kicker">Тест · Матч-центр</div>
  <h1 class="title">Анимация удаления</h1>
  <p class="sub">Нажми на карточку или кнопку — анимация перезапустится. На телефоне работает обычный тап.</p>
  <section class="stage">
    <article id="penaltyCard" class="event" role="button" tabindex="0" aria-label="Проиграть анимацию удаления">
      <div class="time"><strong>12:47</strong><span>2 период</span></div>
      <img id="teamLogo" class="logo" alt="Логотип команды">
      <div class="main"><div class="avatar">17</div><div class="copy"><div class="label"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8.2" cy="15.4" r="4.1" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M11.7 13.2h5.8c1.6 0 2.8 1.2 2.8 2.7s-1.2 2.7-2.8 2.7h-5.7M10.3 11.9l3-4.8 2 1.2-2.3 3.8M15.1 7.7l2.2-2.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Удаление</div><strong>№17 Иван Петров</strong><p>Блокировка соперника · «Крылья Советов»</p></div></div>
      <div class="mins">2 мин.</div>
      <div class="penalty-layer" aria-hidden="true">
        <div class="penalty-layer-inner penalty-phase-b">
          <div class="penalty-minutes">2′</div>
          <div class="penalty-reason">Блокировка</div>
        </div>
        <div class="penalty-cover">
          <div class="penalty-layer-inner penalty-phase-a">
            <div class="whistle"><svg viewBox="0 0 64 64"><circle cx="22" cy="40" r="11" fill="none" stroke="currentColor" stroke-width="5"/><path d="M31 34h15c5 0 9 4 9 9s-4 9-9 9H31M27 30l9-16 8 4-7 13M43 16l7-7" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <div class="penalty-word">Удаление</div>
            <img id="layerLogo" class="penalty-team-logo" alt="">
          </div>
        </div>
      </div>
    </article>
    <div class="controls"><button id="replay" class="btn" type="button">Проиграть ещё раз</button><div class="hint">Сценарий ~5,8 сек · клик/тап по карточке тоже запускает</div></div>
  </section>
</main>
<script src="/team-branding.js?v=20260909-1"></script>
<script>
(()=>{
 const card=document.getElementById('penaltyCard'),btn=document.getElementById('replay');
 const team=window.RussianCupTeamBranding?.get('Крылья Советов');
 const logo=team?.logo||'';document.getElementById('teamLogo').src=logo;document.getElementById('layerLogo').src=logo;
 let timer=0;
 function play(){clearTimeout(timer);card.classList.remove('penalty-playing');void card.offsetWidth;card.classList.add('penalty-playing');timer=setTimeout(()=>card.classList.remove('penalty-playing'),5950)}
 btn.addEventListener('click',play);card.addEventListener('pointerup',play);card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();play()}});
 setTimeout(play,450);
})();
</script>
</body>
</html>
