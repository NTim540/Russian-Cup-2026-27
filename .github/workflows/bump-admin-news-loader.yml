name: Bump admin loader cache
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update admin loader version
        run: python -c "from pathlib import Path; p=Path('admin.html'); s=p.read_text(encoding='utf-8'); import re; s,n=re.subn(r'/admin-teams\\.js\\?v=[^\"\\']+', '/admin-teams.js?v=20260903-4', s, count=1); assert n==1, 'admin-teams loader not found'; p.write_text(s,encoding='utf-8')"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "Bump admin news loader cache" || exit 0
          git push
