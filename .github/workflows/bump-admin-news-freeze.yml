name: Bump admin news freeze loader
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin loader cache
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          s,n=re.subn(r'/admin-teams\.js\?v=[^"\']+', '/admin-teams.js?v=20260903-5', s, count=1)
          assert n==1, 'admin-teams loader not found'
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and self-delete
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bump-admin-news-freeze.yml
          git add admin.html
          git commit -m "Bump admin news freeze cache"
          git push
