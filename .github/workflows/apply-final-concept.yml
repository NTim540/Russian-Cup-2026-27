name: Apply final visual concept
on:
  push:
    paths:
      - '.github/workflows/apply-final-concept.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject final concept scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          files = {
              'index.html': '<script src="/concept-final.js?v=20260820-1"></script>',
              'history-2025-26.html': '<script src="/history-polish.js?v=20260820-1"></script>',
          }
          for name, tag in files.items():
              p=Path(name)
              text=p.read_text(encoding='utf-8')
              if tag not in text:
                  text=text.replace('</body>', tag+'\n</body>')
                  p.write_text(text,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          rm .github/workflows/apply-final-concept.yml
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add index.html history-2025-26.html .github/workflows/apply-final-concept.yml
          git commit -m "Complete visual concept rollout"
          git push