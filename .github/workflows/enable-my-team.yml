name: Enable My Team
on:
  push:
    paths:
      - '.github/workflows/enable-my-team.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable My Team scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          changes=[]
          p=Path('index.html'); s=p.read_text()
          tag='<script src="/my-team.js?v=20260823-1"></script>'
          if tag not in s:
              anchor='<script src="/team-links.js?v=20260823-1"></script>'
              if anchor not in s: raise SystemExit('index anchor not found')
              s=s.replace(anchor,anchor+'\n'+tag,1); p.write_text(s); changes.append('index.html')
          p=Path('team.html'); s=p.read_text()
          if tag not in s:
              anchor='<script src="/team-detail.js?v=20260823-2"></script>'
              if anchor not in s: raise SystemExit('team anchor not found')
              s=s.replace(anchor,anchor+'\n'+tag,1); p.write_text(s); changes.append('team.html')
          print('changed',changes)
          PY
          rm .github/workflows/enable-my-team.yml
          git config user.name 'ChatGPT/actions'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html team.html .github/workflows/enable-my-team.yml
          git commit -m 'Enable My Team personalization'
          git push
