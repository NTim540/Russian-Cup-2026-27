name: Enable hotfix v1
on:
  push:
    paths:
      - '.github/workflows/enable-hotfix-v1.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<script src="/concept-v1.js?v=20260820-1"></script>'
          new=old+'\n<script src="/hotfix-v1.js?v=20260820-1"></script>'
          if '/hotfix-v1.js' not in s:
              if old not in s:
                  raise SystemExit('concept script marker not found')
              s=s.replace(old,new,1)
              p.write_text(s)
          PY
          rm .github/workflows/enable-hotfix-v1.yml
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/enable-hotfix-v1.yml
          git commit -m "Enable match center and table hotfix"
          git push
