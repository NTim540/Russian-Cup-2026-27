name: Publish head-to-head assets

on:
  push:
    paths:
      - '.github/workflows/publish-h2h.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump public asset version
        run: sed -i 's#/logos.js?v=20260820-2#/logos.js?v=20260820-3#g' index.html
      - name: Clean workflows and commit
        run: |
          rm -f .github/workflows/publish-h2h.yml .github/workflows/add-head-to-head.yml
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/publish-h2h.yml .github/workflows/add-head-to-head.yml
          git commit -m "Publish head-to-head match center"
          git push