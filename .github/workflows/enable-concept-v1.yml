name: Enable visual concept v1

on:
  push:
    paths:
      - '.github/workflows/enable-concept-v1.yml'

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject concept script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<script src="/theme.js?v=20260820-1"></script>'
          tag='<script src="/concept-v1.js?v=20260820-1"></script>'
          if tag not in s:
              if marker not in s:
                  raise SystemExit('theme marker not found')
              s=s.replace(marker, marker+'\n'+tag)
              p.write_text(s)
          PY
      - name: Commit redesign enablement
        run: |
          rm .github/workflows/enable-concept-v1.yml
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/enable-concept-v1.yml
          git commit -m "Enable homepage visual concept v1" || exit 0
          git push
