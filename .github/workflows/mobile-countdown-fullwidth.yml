name: Mobile countdown full width
on:
  push:
    paths:
      - '.github/workflows/mobile-countdown-fullwidth.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch contacts.js
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('contacts.js')
          s=p.read_text()
          old="#tournament-countdown .first-match-teams{gap:8px}#tournament-countdown .first-team{display:grid;justify-content:stretch;justify-items:center;text-align:center;gap:7px;font-size:13px}#tournament-countdown .first-team.away{justify-content:stretch;text-align:center}#tournament-countdown .first-team-logo{width:48px;height:48px}"
          new="#tournament-countdown .first-match-teams{width:100%;grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr);gap:10px;align-items:center}#tournament-countdown .first-team{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;font-size:14px}#tournament-countdown .first-team.away{justify-content:center;text-align:center}#tournament-countdown .first-match-vs{display:flex;align-items:center;justify-content:center;min-width:30px;font-size:24px}#tournament-countdown .first-team-logo{width:52px;height:52px}"
          if old not in s:
              raise SystemExit('mobile CSS target not found')
          s=s.replace(old,new,1)
          old_markup='<div class="first-team away"><span class="first-team-name">${esc(away)}</span>${logoHtml(away)}</div>'
          new_markup='<div class="first-team away">${logoHtml(away)}<span class="first-team-name">${esc(away)}</span></div>'
          if old_markup not in s:
              raise SystemExit('away markup target not found')
          s=s.replace(old_markup,new_markup,1)
          p.write_text(s)
          PY
          rm .github/workflows/mobile-countdown-fullwidth.yml
          git config user.name 'ChatGPT/actions'
          git config user.email 'actions@users.noreply.github.com'
          git add contacts.js .github/workflows/mobile-countdown-fullwidth.yml
          git commit -m 'Stretch countdown matchup across mobile width'
          git push
