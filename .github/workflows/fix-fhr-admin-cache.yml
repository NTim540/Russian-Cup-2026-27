name: Fix FHR admin cache
on:
  push:
    paths:
      - '.github/workflows/fix-fhr-admin-cache.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update admin cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          old='/admin-teams.js?v=20260823-2'
          new='/admin-teams.js?v=20260827-2'
          if old not in s and new not in s:
              raise SystemExit('admin-teams script reference not found')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          rm .github/workflows/fix-fhr-admin-cache.yml
      - name: Commit fix
        run: |
          git config user.name "ChatGPT/actions"
          git config user.email "actions@users.noreply.github.com"
          git add admin.html .github/workflows/fix-fhr-admin-cache.yml
          git commit -m "Fix FHR sync admin cache loading"
          git push
