name: Enable admin teams editor
on:
  push:
    paths:
      - '.github/workflows/enable-admin-teams.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable team editor
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()
          tag='<script src="/admin-teams.js?v=20260823-1"></script>'
          if tag not in s:
              anchor='<script src="/admin-analytics.js?v=20260820-1"></script>'
              if anchor not in s: raise SystemExit('admin analytics anchor not found')
              s=s.replace(anchor,anchor+'\n'+tag,1)
              p.write_text(s)
          PY
          rm .github/workflows/enable-admin-teams.yml
          git config user.name 'ChatGPT/actions'
          git config user.email 'actions@users.noreply.github.com'
          git add admin.html .github/workflows/enable-admin-teams.yml
          git commit -m 'Enable team editor in admin'
          git push