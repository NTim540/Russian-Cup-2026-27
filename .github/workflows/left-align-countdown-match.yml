name: Left align countdown match

on:
  push:
    paths:
      - '.github/workflows/left-align-countdown-match.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Left align first match block
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('contacts.js')
          s = p.read_text(encoding='utf-8')
          old1 = "#tournament-countdown .first-match-teams{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px}"
          new1 = "#tournament-countdown .first-match-teams{display:flex;align-items:center;justify-content:flex-start;gap:16px;flex-wrap:wrap}"
          old2 = "#tournament-countdown .first-team{display:flex;align-items:center;justify-content:flex-end;gap:12px;min-width:0;font-size:clamp(18px,2.2vw,28px);font-weight:950;letter-spacing:-.025em}"
          new2 = "#tournament-countdown .first-team{display:flex;align-items:center;justify-content:flex-start;gap:12px;min-width:0;font-size:clamp(18px,2.2vw,28px);font-weight:950;letter-spacing:-.025em}"
          for old,new in [(old1,new1),(old2,new2)]:
              if old not in s:
                  raise SystemExit('Expected CSS snippet not found')
              s = s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/left-align-countdown-match.yml
      - name: Commit changes
        run: |
          git config user.name "ChatGPT/actions"
          git config user.email "actions@users.noreply.github.com"
          git add contacts.js .github/workflows/left-align-countdown-match.yml
          git commit -m "Left align first match matchup"
          git push
