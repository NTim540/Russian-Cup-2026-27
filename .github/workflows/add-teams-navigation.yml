name: Add teams navigation
on:
  push:
    paths:
      - '.github/workflows/add-teams-navigation.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add teams links
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<a href="#upcoming">Матчи</a><a href="#overall">Таблица</a><a href="#groups">Группы</a><a href="#rules">Регламент</a><a href="#history">История</a>'
          new='<a href="#upcoming">Матчи</a><a href="#overall">Таблица</a><a href="#groups">Группы</a><a href="/teams.html">Команды</a><a href="#rules">Регламент</a><a href="#history">История</a>'
          if old not in s:
              raise SystemExit('header nav target not found')
          s=s.replace(old,new,1)
          old2='<div class="footer-nav"><a href="#upcoming">Матчи</a><a href="#overall">Таблицы</a><a href="#rules">Регламент</a><a href="#history">История</a><a class="admin-link" href="/admin">Администрирование</a></div>'
          new2='<div class="footer-nav"><a href="#upcoming">Матчи</a><a href="#overall">Таблицы</a><a href="/teams.html">Команды</a><a href="#rules">Регламент</a><a href="#history">История</a><a class="admin-link" href="/admin">Администрирование</a></div>'
          if old2 not in s:
              raise SystemExit('footer nav target not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "ChatGPT/actions"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/add-teams-navigation.yml
          git add index.html .github/workflows/add-teams-navigation.yml
          git commit -m "Add teams section to navigation"
          git push