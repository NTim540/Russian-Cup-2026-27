name: Add contacts section
on:
  push:
    paths:
      - '.github/workflows/add-contacts-section.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert contacts script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='<script src="/analytics.js?v=20260820-1"></script>'
          insert='<script src="/contacts.js?v=20260820-1"></script>\n'+marker
          if '/contacts.js' not in s:
              if marker not in s:
                  raise SystemExit('analytics marker not found')
              s=s.replace(marker,insert,1)
              p.write_text(s)
          PY
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/add-contacts-section.yml
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/add-contacts-section.yml
          if ! git diff --cached --quiet; then
            git commit -m "Add contacts section to public site"
            git push
          fi
