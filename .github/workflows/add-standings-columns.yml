name: Add standings result columns

on:
  push:
    paths:
      - '.github/workflows/add-standings-columns.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update standings columns
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old_raw="function raw(t,g,ms,s){let o={team_id:t.id,team:t.name,group_id:g.id,group_code:g.code,gp:0,w:0,rw:0,gf:0,ga:0,gd:0,pts:0,unresolved:false};for(const m of ms){if(!done(m)||![m.home_team_id,m.away_team_id].includes(t.id))continue;o.gp++;const h=m.home_team_id===t.id,f=h?m.home_score:m.away_score,a=h?m.away_score:m.home_score;o.gf+=f;o.ga+=a;o.pts+=pts(m,t.id,s);if(f>a){o.w++;if(m.finish_type==='REG')o.rw++}}o.gd=o.gf-o.ga;return o}"
          new_raw="function raw(t,g,ms,s){let o={team_id:t.id,team:t.name,group_id:g.id,group_code:g.code,gp:0,w:0,rw:0,ow:0,l:0,rl:0,ol:0,gf:0,ga:0,gd:0,pts:0,unresolved:false};for(const m of ms){if(!done(m)||![m.home_team_id,m.away_team_id].includes(t.id))continue;o.gp++;const h=m.home_team_id===t.id,f=h?m.home_score:m.away_score,a=h?m.away_score:m.home_score;o.gf+=f;o.ga+=a;o.pts+=pts(m,t.id,s);if(f>a){o.w++;if(m.finish_type==='REG')o.rw++;else o.ow++}else{o.l++;if(m.finish_type==='REG')o.rl++;else o.ol++}}o.gd=o.gf-o.ga;return o}"
          if old_raw not in s:
              raise SystemExit('raw standings function not found')
          s=s.replace(old_raw,new_raw,1)

          old_table="function table(rows,compact=false){return'<thead><tr><th>№</th><th class=\"team\">Команда</th>'+(compact?'':'<th>Гр.</th>')+'<th>И</th><th>В</th><th>ВО</th><th>Шайбы</th><th>±</th><th>О</th></tr></thead><tbody>'+rows.map(r=>'<tr><td class=\"place\">'+r.place+'</td><td class=\"team\">'+esc(r.team)+'</td>'+(compact?'':'<td><span class=\"group-chip\">'+esc(r.group_code)+'</span></td>')+'<td>'+r.gp+'</td><td>'+r.w+'</td><td>'+r.rw+'</td><td>'+r.gf+':'+r.ga+'</td><td class=\"'+(r.gd>0?'gd-pos':r.gd<0?'gd-neg':'')+'\">'+(r.gd>0?'+':'')+r.gd+'</td><td class=\"points\">'+r.pts+'</td></tr>').join('')+'</tbody>'}"
          new_table="function table(rows,compact=false){return'<thead><tr><th>№</th><th class=\"team\">Команда</th>'+(compact?'':'<th>Гр.</th>')+'<th>И</th><th title=\"Победы в основное время\">В</th><th title=\"Поражения в основное время\">П</th><th title=\"Победы в овертайме или по буллитам\">ВО/Б</th><th title=\"Поражения в овертайме или по буллитам\">ПО/Б</th><th>Шайбы</th><th>±</th><th>О</th></tr></thead><tbody>'+rows.map(r=>'<tr><td class=\"place\">'+r.place+'</td><td class=\"team\">'+esc(r.team)+'</td>'+(compact?'':'<td><span class=\"group-chip\">'+esc(r.group_code)+'</span></td>')+'<td>'+r.gp+'</td><td>'+r.rw+'</td><td>'+r.rl+'</td><td>'+r.ow+'</td><td>'+r.ol+'</td><td>'+r.gf+':'+r.ga+'</td><td class=\"'+(r.gd>0?'gd-pos':r.gd<0?'gd-neg':'')+'\">'+(r.gd>0?'+':'')+r.gd+'</td><td class=\"points\">'+r.pts+'</td></tr>').join('')+'</tbody>'}"
          if old_table not in s:
              raise SystemExit('table renderer not found')
          s=s.replace(old_table,new_table,1)

          s=s.replace('table{border-collapse:collapse;width:100%;min-width:860px}','table{border-collapse:collapse;width:100%;min-width:980px}',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          rm .github/workflows/add-standings-columns.yml
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/add-standings-columns.yml
          git commit -m "Add win and loss columns to standings"
          git push