name: Fix FHR admin direct load

on:
  push:
    paths:
      - '.github/workflows/fix-fhr-admin-direct.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump admin teams loader and remove workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          import re
          s2,n=re.subn(r'/admin-teams\.js\?v=[^"\']+', '/admin-teams.js?v=20260827-3', s, count=1)
          if n != 1:
              raise SystemExit('admin-teams script reference not found')
          p.write_text(s2, encoding='utf-8')
          PY
          git rm .github/workflows/fix-fhr-admin-direct.yml
          git config user.name "ChatGPT/actions"
          git config user.email "actions@users.noreply.github.com"
          git add admin.html
          git commit -m "Force-load FHR sync admin module"
          git push
