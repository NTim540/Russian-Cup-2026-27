name: Remove group column from overall table

on:
  push:
    paths:
      - '.github/workflows/remove-overall-group.yml'

permissions:
  contents: write

jobs:
  fix-overall-table:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove group column from overall standings
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "$('#overallTable').innerHTML=table(o,false);"
          new = "$('#overallTable').innerHTML=table(o,true);"
          if old not in s:
              raise SystemExit('Target render call not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/remove-overall-group.yml

      - name: Commit change
        run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/remove-overall-group.yml
          git commit -m "Remove group column from overall standings"
          git push
