name: Add fan vote script
on:
  push:
    paths:
      - '.github/workflows/add-fan-vote.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Connect fan voting
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="/vote.js?v=20260822-1"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>', 1)
          p.write_text(s)
          PY
      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/add-fan-vote.yml
          git config user.name "ChatGPT/actions"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/add-fan-vote.yml
          git commit -m "Enable fan voting in match center"
          git push
