name: Admin match group filter
on:
  push:
    paths:
      - '.github/workflows/admin-match-group-filter.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin match filters
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()

          old_css='.tabs{display:flex;gap:8px;margin:20px 0;overflow:auto}.tab{white-space:nowrap;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);border-radius:999px;padding:9px 12px;cursor:pointer}.tab.active{background:rgba(47,111,237,.16);border-color:rgba(47,111,237,.4);color:#fff}.section{margin:20px 0}'
          new_css='.tabs{display:flex;gap:8px;margin:20px 0;overflow:auto}.tab{white-space:nowrap;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);border-radius:999px;padding:9px 12px;cursor:pointer}.tab.active{background:rgba(47,111,237,.16);border-color:rgba(47,111,237,.4);color:#fff}.match-filter{display:flex;gap:8px;align-items:center;overflow:auto;margin:0 0 15px;padding:2px 0 4px;scrollbar-width:thin}.match-filter-btn{flex:0 0 auto;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);border-radius:999px;padding:9px 13px;font-weight:800;cursor:pointer}.match-filter-btn:hover{color:#fff;border-color:rgba(127,198,255,.3)}.match-filter-btn.active{background:rgba(47,111,237,.18);border-color:rgba(47,111,237,.48);color:#fff;box-shadow:0 0 0 3px rgba(47,111,237,.07)}.section{margin:20px 0}'
          if old_css not in s: raise SystemExit('css target not found')
          s=s.replace(old_css,new_css,1)

          old_section='<section id="tab-matches" class="hidden"><div class="panel-title"><div><h2 style="margin:0">Матчи</h2><div class="muted">Счёт, дата, время, город и арена сохраняются одной кнопкой.</div></div><button id="addMatch" class="btn">+ Матч</button></div><div id="matches"></div></section>'
          new_section='<section id="tab-matches" class="hidden"><div class="panel-title"><div><h2 style="margin:0">Матчи</h2><div class="muted">Счёт, дата, время, город и арена сохраняются одной кнопкой.</div></div><button id="addMatch" class="btn">+ Матч</button></div><div id="matchGroupFilters" class="match-filter" aria-label="Фильтр матчей по группам"></div><div id="matches"></div></section>'
          if old_section not in s: raise SystemExit('matches section target not found')
          s=s.replace(old_section,new_section,1)

          old_state="let PW='',C,D;"
          new_state="let PW='',C,D,MATCH_GROUP_FILTER='all';"
          if old_state not in s: raise SystemExit('state target not found')
          s=s.replace(old_state,new_state,1)

          old_render="$('#publicLink').innerHTML='Публичная ссылка: <a target=\"_blank\" href=\"/?t='+encodeURIComponent(t.slug)+'\">'+location.origin+'/?t='+esc(t.slug)+'</a>';renderGroups();renderMatches()}"
          new_render="$('#publicLink').innerHTML='Публичная ссылка: <a target=\"_blank\" href=\"/?t='+encodeURIComponent(t.slug)+'\">'+location.origin+'/?t='+esc(t.slug)+'</a>';renderGroups();renderMatchGroupFilters();renderMatches()}"
          if old_render not in s: raise SystemExit('render target not found')
          s=s.replace(old_render,new_render,1)

          marker='function renderMatches(){const ms=[...D.matches].sort((a,b)=>a.game_date.localeCompare(b.game_date)||(a.start_time||\'99:99\').localeCompare(b.start_time||\'99:99\')||(a.game_no-b.game_no));'
          replacement="function renderMatchGroupFilters(){const box=$('#matchGroupFilters');if(!box||!D)return;const gs=[...D.groups].sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));if(MATCH_GROUP_FILTER!=='all'&&!gs.some(g=>String(g.id)===String(MATCH_GROUP_FILTER)))MATCH_GROUP_FILTER='all';const btn=(value,label)=>'<button type=\"button\" class=\"match-filter-btn'+(String(MATCH_GROUP_FILTER)===String(value)?' active':'')+'\" data-match-group=\"'+esc(value)+'\">'+esc(label)+'</button>';box.innerHTML=btn('all','Все матчи')+gs.map(g=>btn(g.id,g.code||g.name||('Группа '+g.id))).join('');box.querySelectorAll('[data-match-group]').forEach(b=>b.onclick=()=>{MATCH_GROUP_FILTER=b.dataset.matchGroup;renderMatchGroupFilters();renderMatches()})}\nfunction renderMatches(){const ms=[...D.matches].filter(m=>MATCH_GROUP_FILTER==='all'||String(m.group_id)===String(MATCH_GROUP_FILTER)).sort((a,b)=>a.game_date.localeCompare(b.game_date)||(a.start_time||'99:99').localeCompare(b.start_time||'99:99')||(a.game_no-b.game_no));"
          if marker not in s: raise SystemExit('renderMatches target not found')
          s=s.replace(marker,replacement,1)

          p.write_text(s)
          PY
          rm .github/workflows/admin-match-group-filter.yml
          git config user.name 'ChatGPT/actions'
          git config user.email 'actions@users.noreply.github.com'
          git add admin.html .github/workflows/admin-match-group-filter.yml
          git commit -m 'Add group filter to admin matches'
          git push