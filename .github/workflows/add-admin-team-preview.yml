# trigger
name: Add admin team preview
on:
  push:
    paths:
      - '.github/workflows/add-admin-team-preview.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add preview script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()
          old='<script src="/admin-teams.js?v=20260823-1"></script>'
          new='<script src="/admin-teams.js?v=20260823-1"></script>\n<script src="/admin-team-preview.js?v=20260823-1"></script>'
          if new not in s:
              if old not in s:
                  raise SystemExit('admin-teams script tag not found')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          rm .github/workflows/add-admin-team-preview.yml
          git config user.name 'ChatGPT/actions'
          git config user.email 'actions@users.noreply.github.com'
          git add admin.html .github/workflows/add-admin-team-preview.yml
          git commit -m 'Load live team preview in admin'
          git push
