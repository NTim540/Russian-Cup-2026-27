name: Fix fan vote match detection
on:
  push:
    paths:
      - '.github/workflows/fix-fan-vote-match-detection.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch vote match detection
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('vote.js')
          s=p.read_text()
          old="""  function matchFromPage(id){
    try{
      if(typeof D==='undefined'||!D?.matches||!D?.teams) return null;
      const m=D.matches.find(x=>Number(x.id)===Number(id));
      if(!m) return null;
      const home=D.teams.find(t=>Number(t.id)===Number(m.home_team_id));
      const away=D.teams.find(t=>Number(t.id)===Number(m.away_team_id));
      if(!home||!away) return null;
      return {m,home,away};
    }catch{return null}
  }
"""
          new="""  function matchFromPage(value){
    try{
      if(typeof D==='undefined'||!D?.matches||!D?.teams) return null;
      const n=Number(value);
      let m=Number.isFinite(n)?D.matches.find(x=>Number(x.id)===n):null;
      if(!m&&Number.isFinite(n))m=D.matches.find(x=>Number(x.game_no)===n);
      if(!m){
        const dialog=document.querySelector('.mc-dialog');
        const chipText=[...dialog?.querySelectorAll('.mc-chip')||[]].map(x=>x.textContent||'').join(' ');
        const no=chipText.match(/матч\s*№\s*(\d+)/i);
        if(no)m=D.matches.find(x=>Number(x.game_no)===Number(no[1]));
      }
      if(!m){
        const title=(document.querySelector('.mc-title')?.textContent||'').trim().toLowerCase();
        if(title){
          m=D.matches.find(x=>{
            const home=D.teams.find(t=>Number(t.id)===Number(x.home_team_id))?.name||'';
            const away=D.teams.find(t=>Number(t.id)===Number(x.away_team_id))?.name||'';
            return title.includes(home.toLowerCase())&&title.includes(away.toLowerCase());
          });
        }
      }
      if(!m) return null;
      const home=D.teams.find(t=>Number(t.id)===Number(m.home_team_id));
      const away=D.teams.find(t=>Number(t.id)===Number(m.away_team_id));
      if(!home||!away) return null;
      return {m,home,away};
    }catch{return null}
  }
"""
          if old not in s:
              raise SystemExit('matchFromPage target not found')
          s=s.replace(old,new,1)
          old2="""    const matchId=Number(new URL(location.href).searchParams.get('match'));
    if(!matchId) return;
    const ctx=matchFromPage(matchId);
    if(!ctx) return;
    let block=dialog.querySelector('.mc-fan-vote');
    if(block&&Number(block.dataset.matchId)===matchId) return;
    if(block) block.remove();
    block=document.createElement('section');
    block.className='mc-fan-vote';
    block.dataset.matchId=String(matchId);
"""
          new2="""    const param=new URL(location.href).searchParams.get('match');
    const ctx=matchFromPage(param);
    if(!ctx) return;
    const matchId=Number(ctx.m.id);
    let block=dialog.querySelector('.mc-fan-vote');
    if(block&&Number(block.dataset.matchId)===matchId) return;
    if(block) block.remove();
    block=document.createElement('section');
    block.className='mc-fan-vote';
    block.dataset.matchId=String(matchId);
"""
          if old2 not in s:
              raise SystemExit('mount target not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Bump vote script cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('/vote.js?v=20260822-1','/vote.js?v=20260822-2')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "ChatGPT/actions"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/fix-fan-vote-match-detection.yml
          git add vote.js index.html .github/workflows/fix-fan-vote-match-detection.yml
          git commit -m "Fix fan voting match detection"
          git push
