name: Fix My Team render loop
on:
  push:
    paths:
      - '.github/workflows/fix-my-team-loop.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch My Team refresh logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('my-team.js')
          s=p.read_text()
          old="""    new MutationObserver(()=>{if(currentData())renderHome()}).observe(document.body,{childList:true,subtree:true});
    window.addEventListener('favorite-team-change',renderHome);
    window.addEventListener('storage',e=>{if(e.key===KEY)renderHome()});"""
          new="""    // Do not observe the whole document here: renderHome() changes the DOM itself,
    // which would retrigger a MutationObserver indefinitely and overload the page.
    const refresh=()=>{if(currentData())renderHome()};
    setInterval(refresh,15000);
    window.addEventListener('favorite-team-change',refresh);
    window.addEventListener('storage',e=>{if(e.key===KEY)refresh()});"""
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
          PY
          rm .github/workflows/fix-my-team-loop.yml
          git config user.name 'ChatGPT/actions'
          git config user.email 'actions@users.noreply.github.com'
          git add my-team.js .github/workflows/fix-my-team-loop.yml
          git commit -m 'Stop My Team infinite render loop'
          git push