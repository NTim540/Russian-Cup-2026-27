name: Inject logos runtime

on:
  push:
    paths:
      - '.github/workflows/inject-logos-script.yml'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add logos script to page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="/logos.js?v=20260820-1"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('body closing tag not found')
              s = s.replace('</body>', tag + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/inject-logos-script.yml

      - name: Commit change
        run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/inject-logos-script.yml
          git commit -m "Enable logos on public site"
          git push
