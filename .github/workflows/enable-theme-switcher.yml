name: Enable theme switcher

on:
  push:
    paths:
      - '.github/workflows/enable-theme-switcher.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect theme switcher
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script src="/logos.js?v=20260820-4"></script>'
          insert=marker+'\n<script src="/theme.js?v=20260820-1"></script>'
          if '/theme.js?' not in s:
              if marker not in s:
                  raise SystemExit('logos.js marker not found')
              s=s.replace(marker,insert,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit public theme switcher
        run: |
          rm .github/workflows/enable-theme-switcher.yml
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/enable-theme-switcher.yml
          git commit -m "Enable light and dark theme switcher"
          git push