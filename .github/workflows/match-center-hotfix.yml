name: Match center hotfix

on:
  push:
    paths:
      - '.github/workflows/match-center-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply match center fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('match.html')
          s=p.read_text()
          s=s.replace('/match-page-v2.js?v=20260910-5','/match-page-v2.js?v=20260910-6')
          s=s.replace('/match-score-restore.js?v=20260910-5','/match-score-restore.js?v=20260910-6')
          p.write_text(s)

          p=Path('match-score-restore.js')
          s=p.read_text()
          old="if(h.endsWith('vk.com')||h.endsWith('vkvideo.ru')||h.endsWith('vk.ru')){if(/video_ext\\.php/i.test(u.pathname))return url;const m=u.pathname.match(/\\/video(-?\\d+)_(-?\\d+)/i);if(m)return `https://vkvideo.ru/video_ext.php?oid=${m[1]}&id=${m[2]}&hd=2`; }"
          new="if(h.endsWith('vk.com')||h.endsWith('vkvideo.ru')||h.endsWith('vk.ru')){if(/video_ext\\.php/i.test(u.pathname))return url;return''}"
          if old in s:
              s=s.replace(old,new)
          s=s.replace('Трансляция доступна по внешней ссылке','Трансляция доступна')
          s=s.replace('Этот источник нельзя встроить прямо в страницу. Открыть эфир можно по кнопке ниже.','Эта ссылка открывается на площадке трансляции. Если позже будет добавлен официальный embed-код, видео появится прямо здесь.')
          s=s.replace('Открыть трансляцию</a>','Смотреть трансляцию</a>')
          p.write_text(s)
          PY
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add match.html match-score-restore.js
          git diff --cached --quiet && exit 0
          git commit -m 'Replace black VK iframe with safe stream fallback'
          git push
