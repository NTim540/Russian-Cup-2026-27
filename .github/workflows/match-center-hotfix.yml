name: Match center hotfix

on:
  push:
    paths:
      - '.github/workflows/match-center-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore optimized VK embed
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('match.html')
          s=p.read_text()
          s=s.replace('/match-page-v2.js?v=20260910-7','/match-page-v2.js?v=20260910-8')
          s=s.replace('/match-score-restore.js?v=20260910-7','/match-score-restore.js?v=20260910-8')
          p.write_text(s)

          p=Path('match-score-restore.js')
          s=p.read_text()
          old="if(h.endsWith('vk.com')||h.endsWith('vkvideo.ru')||h.endsWith('vk.ru')){if(/video_ext\\.php/i.test(u.pathname))return url;return''}"
          new="if(h.endsWith('vk.com')||h.endsWith('vkvideo.ru')||h.endsWith('vk.ru')){if(/video_ext\\.php/i.test(u.pathname))return url;const m=u.pathname.match(/\\/video(-?\\d+)_(-?\\d+)/i);if(m)return `https://vk.com/video_ext.php?oid=${m[1]}&id=${m[2]}&hd=2&autoplay=0`;return''}"
          if old not in s:
              raise SystemExit('VK parser block not found')
          s=s.replace(old,new)
          s=s.replace('allow="autoplay; encrypted-media; picture-in-picture; fullscreen"','allow="autoplay; encrypted-media; fullscreen; picture-in-picture; screen-wake-lock"')
          s=s.replace(' loading="lazy" referrerpolicy="strict-origin-when-cross-origin"','')
          p.write_text(s)
          PY
      - name: Commit VK embed fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add match.html match-score-restore.js
          git diff --cached --quiet && exit 0
          git commit -m 'Restore optimized VK player in match center'
          git push
