name: Bump match center asset version

on:
  push:
    paths:
      - '.github/workflows/bump-match-center-assets.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump logos runtime version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('/logos.js?v=20260820-1','/logos.js?v=20260820-2')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Clean workflow and commit
        run: |
          rm .github/workflows/bump-match-center-assets.yml
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/bump-match-center-assets.yml
          git commit -m "Publish interactive match center"
          git push
