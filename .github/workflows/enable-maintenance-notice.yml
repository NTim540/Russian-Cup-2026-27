name: Enable maintenance notice
on:
  push:
    paths:
      - '.github/workflows/enable-maintenance-notice.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable maintenance notice
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="/maintenance.js?v=20260822-1"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('body end not found')
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s)
          PY
          rm .github/workflows/enable-maintenance-notice.yml
          git config user.name 'ChatGPT/actions'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/enable-maintenance-notice.yml
          git commit -m 'Enable maintenance notice on public site'
          git push