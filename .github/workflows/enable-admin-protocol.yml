name: Enable admin protocol editor

on:
  push:
    paths:
      - '.github/workflows/enable-admin-protocol.yml'

permissions:
  contents: write

jobs:
  patch-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add protocol editor script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/admin-protocol.js?v=20260820-1"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('body closing tag not found')
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Clean workflow and commit
        run: |
          rm .github/workflows/enable-admin-protocol.yml
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add admin.html .github/workflows/enable-admin-protocol.yml
          git commit -m "Enable match protocol editor in admin"
          git push
