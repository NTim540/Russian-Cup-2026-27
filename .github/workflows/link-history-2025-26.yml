name: Link 2025-26 archive
on:
  push:
    paths:
      - '.github/workflows/link-history-2025-26.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<article class="card history-card hover-card"><div class="history-year">2025/26</div><div class="history-copy"><strong>Кубок России U16</strong><span>Соревнование для команд 2010 года рождения</span></div><div class="history-arrow">→</div></article>'
          new='<a class="card history-card hover-card" href="/history-2025-26.html" aria-label="Открыть архив Кубка России U16 сезона 2025/26"><div class="history-year">2025/26</div><div class="history-copy"><strong>Кубок России U16</strong><span>Первый розыгрыш · 2010 г.р. · таблицы, финалы и статистика</span></div><div class="history-arrow">→</div></a>'
          if old not in s:
              raise SystemExit('History card pattern not found')
          s=s.replace(old,new,1)
          s=s.replace('Со временем здесь появится полноценная летопись Кубка России по сезонам.','Архив завершённых розыгрышей: участники, этапы, итоговые таблицы, финалы и статистика.',1)
          p.write_text(s)
          PY
          rm .github/workflows/link-history-2025-26.yml
          git config user.name 'ChatGPT'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .github/workflows/link-history-2025-26.yml
          git commit -m 'Link 2025-26 tournament archive'
          git push
