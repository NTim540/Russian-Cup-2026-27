name: Use team profile data
on:
  push:
    paths:
      - '.github/workflows/use-team-profile-data.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch team pages
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('teams.js')
          s=p.read_text()
          old="function card(team){const logo=TEAM_LOGOS[team.name],city=TEAM_CITIES[team.name]||'Город уточняется';return `"
          new="function card(team){const logo=team.logo_url||TEAM_LOGOS[team.name],city=team.city||TEAM_CITIES[team.name]||'Город уточняется';return `"
          if old not in s: raise SystemExit('teams.js card target not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('team-detail.js')
          s=p.read_text()
          old="  const $=s=>document.querySelector(s);"
          new="  let CURRENT_DATA=null;\n  const $=s=>document.querySelector(s);"
          if old not in s: raise SystemExit('team-detail current data anchor not found')
          s=s.replace(old,new,1)
          old="  function logo(name,cls=''){const src=TEAM_LOGOS[name];return src?`<img class=\"${cls}\" src=\"${src}\" alt=\"Логотип ${esc(name)}\">`:''}"
          new="  function logo(name,cls=''){const t=CURRENT_DATA?.teams?.find(x=>x.name===name),src=t?.logo_url||TEAM_LOGOS[name];return src?`<img class=\"${cls}\" src=\"${src}\" alt=\"Логотип ${esc(name)}\">`:''}"
          if old not in s: raise SystemExit('team-detail logo target not found')
          s=s.replace(old,new,1)
          old="    const data=await get('/api/data?tournament_slug='+encodeURIComponent(tournament.slug)+'&stage_id='+encodeURIComponent(stage.id)),team=data.teams.find(t=>Number(t.id)===id);if(!team)throw Error('Команда не найдена');\n    const meta=TEAM_META[team.name]||{},membership=data.memberships.find(x=>x.team_id===team.id),group=data.groups.find(g=>g.id===membership?.group_id),rows=group?groupRows(group,data):[],teamRow=rows.find(r=>r.team.id===team.id)||{gp:0,w:0,l:0,gf:0,ga:0,gd:0,pts:0,place:'—'},allRows=data.groups.flatMap(g=>groupRows(g,data).map(r=>({...r,group_id:g.id}))).sort((a,b)=>b.pts-a.pts||b.rw-a.rw||b.gd-a.gd||b.gf-a.gf),overallPlace=allRows.findIndex(r=>r.team.id===team.id)+1;"
          new="    const data=await get('/api/data?tournament_slug='+encodeURIComponent(tournament.slug)+'&stage_id='+encodeURIComponent(stage.id)),team=data.teams.find(t=>Number(t.id)===id);if(!team)throw Error('Команда не найдена');\n    CURRENT_DATA=data;\n    const fallback=TEAM_META[team.name]||{},arenas=Array.isArray(team.arenas)?team.arenas:[],arenaText=arenas.length?arenas.map(a=>[a.name,a.address].filter(Boolean).join(' — ')).join(' · '):(fallback.arena||''),meta={city:team.city||fallback.city||'',arena:arenaText,socials:{vk:team.vk_url||fallback.socials?.vk||'',tg:team.telegram_url||fallback.socials?.tg||'',max:team.max_url||fallback.socials?.max||'',web:team.website_url||fallback.socials?.web||''}},membership=data.memberships.find(x=>x.team_id===team.id),group=data.groups.find(g=>g.id===membership?.group_id),rows=group?groupRows(group,data):[],teamRow=rows.find(r=>r.team.id===team.id)||{gp:0,w:0,l:0,gf:0,ga:0,gd:0,pts:0,place:'—'},allRows=data.groups.flatMap(g=>groupRows(g,data).map(r=>({...r,group_id:g.id}))).sort((a,b)=>b.pts-a.pts||b.rw-a.rw||b.gd-a.gd||b.gf-a.gf),overallPlace=allRows.findIndex(r=>r.team.id===team.id)+1;"
          if old not in s: raise SystemExit('team-detail meta target not found')
          s=s.replace(old,new,1)
          old="    const src=TEAM_LOGOS[team.name];if(src){"
          new="    const src=team.logo_url||TEAM_LOGOS[team.name];if(src){"
          if old not in s: raise SystemExit('team-detail hero logo target not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('admin-teams.js')
          s=p.read_text().replace('href=\"/team.html?id=${t.id}\"','href=\"/team.html?team=${t.id}\"')
          p.write_text(s)
          PY
      - name: Bump caches and clean workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          for fn in ['teams.html','team.html']:
              p=Path(fn)
              if not p.exists(): continue
              s=p.read_text()
              s=s.replace('/teams.js?v=20260823-1','/teams.js?v=20260823-2')
              s=s.replace('/team-detail.js?v=20260823-1','/team-detail.js?v=20260823-2')
              p.write_text(s)
          PY
          rm .github/workflows/use-team-profile-data.yml
          git config user.name 'ChatGPT/actions'
          git config user.email 'actions@users.noreply.github.com'
          git add teams.js team-detail.js admin-teams.js teams.html team.html .github/workflows/use-team-profile-data.yml
          git commit -m 'Connect team admin data to public pages'
          git push