<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="robots" content="noindex,nofollow">
<title>Технические работы · Кубок России U16</title>
<style>
:root{--bg:#06101d;--panel:#0c1c30;--line:rgba(255,255,255,.1);--text:#f7f9fc;--muted:#91a3b8;--ice:#7fc6ff;--blue:#2f6fed;--red:#e23a47}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--bg)}body{min-height:100vh;min-height:100svh;overflow:hidden;background:radial-gradient(circle at 12% -8%,rgba(47,111,237,.34),transparent 34%),radial-gradient(circle at 90% 4%,rgba(226,58,71,.13),transparent 28%),linear-gradient(180deg,#07111f,#081526 58%,#050d17)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background-image:linear-gradient(rgba(255,255,255,.026) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.026) 1px,transparent 1px);background-size:52px 52px;mask-image:linear-gradient(to bottom,black,transparent 80%)}.shell{position:relative;z-index:1;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px}.card{position:relative;width:min(760px,100%);overflow:hidden;border:1px solid rgba(127,198,255,.17);border-radius:28px;background:linear-gradient(145deg,rgba(13,32,53,.94),rgba(7,21,37,.94));box-shadow:0 34px 100px rgba(0,0,0,.42);padding:clamp(28px,6vw,56px);text-align:center;backdrop-filter:blur(18px)}.card:after{content:"U16";position:absolute;right:-16px;top:-66px;font-size:220px;font-weight:950;letter-spacing:-.09em;color:rgba(127,198,255,.025);pointer-events:none}.brand{position:relative;z-index:1;display:inline-flex;align-items:center;gap:12px;margin-bottom:30px}.logo{width:56px;height:56px;border:1px solid rgba(127,198,255,.22);border-radius:17px;display:grid;place-items:center;background:rgba(127,198,255,.06)}.logo img{width:43px;height:43px;object-fit:contain}.brand-copy{text-align:left}.brand-copy small{display:block;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.brand-copy strong{display:block;margin-top:3px;font-size:15px}.status{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid rgba(127,198,255,.18);border-radius:999px;background:rgba(127,198,255,.055);color:#cceaff;font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.dot{width:7px;height:7px;border-radius:50%;background:var(--ice);box-shadow:0 0 18px rgba(127,198,255,.95);animation:pulse 1.8s ease-in-out infinite}@keyframes pulse{50%{opacity:.35;transform:scale(.72)}}h1{position:relative;z-index:1;margin:22px 0 14px;font-size:clamp(38px,7vw,70px);line-height:.94;letter-spacing:-.055em}.lead{position:relative;z-index:1;max-width:590px;margin:0 auto;color:#b8c6d6;font-size:clamp(14px,2vw,17px);line-height:1.6}.return{position:relative;z-index:1;margin-top:24px;color:#dbeeff;font-size:12px;font-weight:800}.return b{color:var(--ice)}.countdown{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:520px;margin:22px auto 0}.unit{padding:18px 10px;border:1px solid var(--line);border-radius:17px;background:rgba(255,255,255,.035)}.unit strong{display:block;font-size:clamp(30px,6vw,48px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.04em}.unit span{display:block;margin-top:8px;color:#72869c;font-size:9px;font-weight:900;letter-spacing:.13em;text-transform:uppercase}.foot{position:relative;z-index:1;margin-top:26px;padding-top:20px;border-top:1px solid var(--line);color:#718399;font-size:10px;line-height:1.5}@media(max-width:560px){.shell{padding:14px}.card{border-radius:22px;padding:30px 18px}.brand{margin-bottom:24px}.logo{width:48px;height:48px}.logo img{width:36px;height:36px}.countdown{gap:7px}.unit{padding:15px 6px;border-radius:13px}.lead br{display:none}}
</style>
</head>
<body>
<main class="shell">
<section class="card" aria-live="polite">
<div class="brand"><span class="logo"><img src="https://drive.google.com/thumbnail?id=1hwFp1ukBAQ_Qd-nI5okdiejSRlUrfLeB&sz=w512" alt=""></span><span class="brand-copy"><small>2026/27</small><strong>КУБОК РОССИИ U16</strong></span></div>
<div class="status"><span class="dot"></span>Технические работы</div>
<h1>Скоро вернёмся</h1>
<p class="lead">Готовим сайт к следующему игровому дню: проверяем LIVE-центр, протоколы и стабильность системы.</p>
<div class="return">Работа сайта восстановится <b>18 сентября в 10:00 МСК</b></div>
<div class="countdown" id="countdown">
<div class="unit"><strong id="hh">00</strong><span>часов</span></div>
<div class="unit"><strong id="mm">00</strong><span>минут</span></div>
<div class="unit"><strong id="ss">00</strong><span>секунд</span></div>
</div>
<div class="foot">Спасибо за ожидание. Все данные турнира и протоколы сохранены.</div>
</section>
</main>
<script>
(()=>{const target=Date.parse('2026-09-18T10:00:00+03:00'),hh=document.getElementById('hh'),mm=document.getElementById('mm'),ss=document.getElementById('ss');let reloading=false;function tick(){const left=Math.max(0,target-Date.now()),s=Math.floor(left/1000);hh.textContent=String(Math.floor(s/3600)).padStart(2,'0');mm.textContent=String(Math.floor((s%3600)/60)).padStart(2,'0');ss.textContent=String(s%60).padStart(2,'0');if(left<=0&&!reloading){reloading=true;document.querySelector('.status').innerHTML='<span class="dot"></span>Возвращаем сайт';document.querySelector('.return').innerHTML='Технические работы завершены. <b>Обновляем страницу…</b>';setTimeout(()=>location.reload(),12000)}}tick();setInterval(tick,1000)})();
</script>
</body>
</html>
