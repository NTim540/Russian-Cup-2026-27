<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>Новости · Кубок России U16</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2d;--panel2:#12243b;--line:rgba(255,255,255,.10);--text:#f7f9fc;--muted:#91a0b4;--ice:#7fc6ff;--blue:#2f6fed;--red:#e23a47;--shadow:0 24px 70px rgba(0,0,0,.30)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 12% -5%,rgba(47,111,237,.24),transparent 30%),linear-gradient(180deg,#07111f,#081526 55%,#06101d);min-height:100vh}a{color:inherit;text-decoration:none}.wrap{width:min(1180px,calc(100% - 30px));margin:auto}.header{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);background:rgba(7,17,31,.85);backdrop-filter:blur(18px)}.header-in{min-height:70px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.15em}.brand strong{font-size:15px}.nav{display:flex;gap:8px;align-items:center}.nav a{padding:9px 11px;border-radius:11px;color:#aab8ca;font-size:13px}.nav a:hover{background:rgba(255,255,255,.05);color:#fff}.hero{padding:58px 0 30px}.kicker{color:var(--ice);font-size:10px;text-transform:uppercase;letter-spacing:.15em;font-weight:900}.hero h1{font-size:clamp(42px,7vw,76px);letter-spacing:-.06em;line-height:.9;margin:12px 0 14px}.hero p{max-width:680px;margin:0;color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:10px 0 56px}.card{border:1px solid var(--line);border-radius:20px;overflow:hidden;background:linear-gradient(180deg,rgba(18,36,59,.92),rgba(10,23,40,.96));box-shadow:var(--shadow);transition:.2s ease}.card:hover{transform:translateY(-3px);border-color:rgba(127,198,255,.26)}.cover{height:190px;overflow:hidden;position:relative;background:radial-gradient(circle at 20% 18%,rgba(127,198,255,.28),transparent 38%),linear-gradient(135deg,rgba(47,111,237,.30),rgba(226,58,71,.14))}.cover:after{content:'U16';position:absolute;right:15px;bottom:8px;font-size:54px;font-weight:950;color:rgba(255,255,255,.09);letter-spacing:-.09em}.cover img{width:100%;height:100%;object-fit:cover;display:block}.body{padding:17px}.date{font-size:10px;color:var(--ice);text-transform:uppercase;letter-spacing:.1em;font-weight:900}.body h2{font-size:20px;line-height:1.15;margin:10px 0 8px;letter-spacing:-.025em}.body p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}.empty{grid-column:1/-1;padding:34px;border:1px dashed var(--line);border-radius:18px;text-align:center;color:var(--muted)}.article{max-width:900px;margin:0 auto 70px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,rgba(18,36,59,.94),rgba(10,23,40,.97));overflow:hidden;box-shadow:var(--shadow)}.article-cover{max-height:480px;background:rgba(255,255,255,.02);overflow:hidden}.article-cover img{width:100%;display:block;max-height:480px;object-fit:cover}.article-inner{padding:clamp(22px,5vw,46px)}.back{display:inline-block;color:#cde8ff;font-size:12px;font-weight:800;margin-bottom:20px}.article h1{font-size:clamp(36px,6vw,64px);line-height:.95;letter-spacing:-.05em;margin:12px 0 16px}.lead{font-size:17px;line-height:1.55;color:#c8d3e1;margin:0 0 28px}.article-text{font-size:16px;line-height:1.75;color:#d7e0eb}.article-text p{margin:0 0 18px}.status{padding:50px 0;color:var(--muted)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.wrap{width:calc(100% - 20px)}.nav a:nth-child(2){display:none}.grid{grid-template-columns:1fr}.cover{height:210px}.article-inner{padding:20px}.article h1{font-size:40px}}
</style>
</head>
<body>
<header class="header"><div class="wrap header-in"><a class="brand" href="/"><small>Кубок России U16</small><strong>Сайт турнира</strong></a><nav class="nav"><a href="/">Главная</a><a href="/teams.html">Команды</a><a href="/news.html">Новости</a></nav></div></header>
<main class="wrap" id="main"><section class="hero"><div class="kicker">Пресс-центр</div><h1>Новости</h1><p>Объявления, результаты, изменения и другие важные события Кубка России U16.</p></section><div id="content" class="status">Загружаем…</div></main>
<script src="/news-widgets.js?v=20260903-1"></script>
<script>
const API='https://wcucbtdfkghjirpbqzzk.supabase.co/functions/v1/russian-cup-news';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=x=>{try{return new Date(x).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}catch{return ''}};
function articleText(s){return String(s||'').split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean).map(p=>'<p>'+esc(p).replace(/\n/g,'<br>')+'</p>').join('')}
async function load(){const q=new URLSearchParams(location.search),id=Number(q.get('id')),box=document.getElementById('content');try{if(Number.isInteger(id)&&id>0){const r=await fetch(API+'?id='+id,{cache:'no-store'}),b=await r.json();if(!r.ok)throw Error(b.error||'Ошибка');const n=b.item;document.title=n.title+' · Кубок России U16';box.className='article';box.innerHTML=`${n.cover_url?`<div class="article-cover"><img src="${esc(n.cover_url)}" alt=""></div>`:''}<div class="article-inner"><a class="back" href="/news.html">← Все новости</a><div class="date">${esc(fmt(n.published_at||n.created_at))}</div><h1>${esc(n.title)}</h1>${n.excerpt?`<p class="lead">${esc(n.excerpt)}</p>`:''}<div class="article-text">${articleText(n.body)}</div><div id="articleWidgets" class="news-widgets"></div></div>`;if(typeof window.renderNewsWidgets==='function')await window.renderNewsWidgets(n,document.getElementById('articleWidgets'));return}
const r=await fetch(API+'?limit=50',{cache:'no-store'}),b=await r.json();if(!r.ok)throw Error(b.error||'Ошибка');const items=b.items||[];box.className='grid';box.innerHTML=items.length?items.map(n=>`<a class="card" href="/news.html?id=${n.id}"><div class="cover">${n.cover_url?`<img src="${esc(n.cover_url)}" alt="" loading="lazy">`:''}</div><div class="body"><div class="date">${esc(fmt(n.published_at||n.created_at))}</div><h2>${esc(n.title)}</h2>${n.excerpt?`<p>${esc(n.excerpt)}</p>`:''}</div></a>`).join(''):'<div class="empty">Опубликованных новостей пока нет.</div>'}catch(e){box.className='empty';box.textContent=e.message||'Не удалось загрузить новости.'}}
load();
</script>
</body>
</html>
