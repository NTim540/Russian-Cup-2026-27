<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>Игрок · Кубок России U16</title>
<style>
:root{--bg:#06101b;--panel:#0b1828;--panel2:#0e2237;--line:rgba(126,190,255,.14);--text:#f5f8fb;--muted:#8498ad;--blue:#2387d9;--ice:#7fc6ff;--red:#e31f2b;--green:#48c38b}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 78% 0,rgba(35,135,217,.18),transparent 27%),linear-gradient(180deg,#06101b,#071423 58%,#050d17);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1160px,calc(100% - 28px));margin:auto}.header{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);background:rgba(4,13,24,.86);backdrop-filter:blur(18px)}.header-in{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.13em;text-transform:uppercase;margin-bottom:2px}.brand strong{font-size:14px}.back{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#bddcf4}.back:hover{color:#fff}.hero{position:relative;overflow:hidden;padding:42px 0 34px;border-bottom:1px solid rgba(126,190,255,.08)}.hero:after{content:"PLAYER";position:absolute;right:2%;top:7px;font-size:clamp(72px,15vw,180px);font-weight:950;letter-spacing:-.07em;color:rgba(127,198,255,.035);pointer-events:none}.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:190px minmax(0,1fr);gap:30px;align-items:center}.photo{width:190px;height:228px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(145deg,rgba(35,135,217,.18),rgba(7,22,36,.88));display:grid;place-items:center;overflow:hidden;box-shadow:0 22px 55px rgba(0,0,0,.28)}.photo img{width:100%;height:100%;object-fit:cover;object-position:center top}.initials{font-size:48px;font-weight:950;color:#d5ecff}.kicker{color:var(--ice);font-size:9px;font-weight:950;letter-spacing:.16em;text-transform:uppercase}.kicker:before{content:"// ";color:var(--red)}h1{margin:10px 0 11px;font-size:clamp(36px,6vw,70px);line-height:.92;letter-spacing:-.055em;text-transform:uppercase}.meta{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:7px 9px;border:1px solid var(--line);border-radius:4px;background:rgba(255,255,255,.025);font-size:9px;text-transform:uppercase;letter-spacing:.055em;color:#c5d6e6}.team-link{color:#9ed6ff}.section{padding:30px 0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:13px;padding-bottom:9px;border-bottom:1px solid rgba(126,190,255,.10)}.section-head h2{margin:0;font-size:24px;text-transform:uppercase;letter-spacing:-.03em}.section-head small{color:var(--muted);font-size:10px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stat{padding:17px 15px;border:1px solid var(--line);border-radius:6px;background:linear-gradient(180deg,rgba(14,34,55,.88),rgba(7,22,36,.9))}.stat strong{display:block;font-size:30px;line-height:1;font-weight:950}.stat span{display:block;margin-top:7px;color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.09em}.stage-list{display:grid;gap:7px}.stage-row{display:grid;grid-template-columns:minmax(170px,1.4fr) repeat(5,minmax(52px,.45fr));gap:8px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:5px;background:rgba(9,27,44,.72)}.stage-name strong{display:block;font-size:12px;text-transform:uppercase}.stage-name span{font-size:9px;color:var(--muted)}.stage-cell{text-align:center}.stage-cell strong{display:block;font-size:15px}.stage-cell span{display:block;margin-top:3px;color:var(--muted);font-size:7px;text-transform:uppercase}.matches{display:grid;gap:7px}.match{display:grid;grid-template-columns:104px 90px minmax(0,1fr) 86px 150px;gap:10px;align-items:center;padding:12px 13px;border:1px solid var(--line);border-radius:5px;background:rgba(8,23,38,.82);transition:.16s ease}.match:hover{border-color:rgba(127,198,255,.3);background:rgba(12,32,51,.94);transform:translateY(-1px)}.match-date,.match-stage{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.match-opponent{font-size:12px;font-weight:850;text-transform:uppercase}.match-score{text-align:center;font-size:17px;font-weight:950}.match-personal{text-align:right;font-size:9px;color:#a9bed2}.match-personal strong{color:#fff}.empty{padding:20px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);font-size:11px;text-align:center}.loading{min-height:55vh;display:grid;place-items:center;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.note{margin-top:10px;color:#667c91;font-size:9px;line-height:1.5}.footer{padding:28px 0 40px;border-top:1px solid var(--line);color:#667c91;font-size:9px}.error{color:#ff9aa3}
@media(max-width:760px){.wrap{width:calc(100% - 18px)}.header-in{min-height:58px}.hero{padding:25px 0}.hero-grid{grid-template-columns:96px minmax(0,1fr);gap:15px}.photo{width:96px;height:124px}.initials{font-size:27px}h1{font-size:clamp(27px,9vw,43px);margin:7px 0 9px}.chip{font-size:7px;padding:5px 6px}.section{padding:23px 0}.stats{grid-template-columns:repeat(3,1fr)}.stat{padding:13px 11px}.stat strong{font-size:23px}.stats .stat:nth-child(4),.stats .stat:nth-child(5){grid-column:span 1}.stage-row{grid-template-columns:minmax(120px,1.5fr) repeat(5,46px);overflow-x:auto;gap:4px;padding:10px 7px}.stage-name strong{font-size:10px}.stage-cell strong{font-size:13px}.match{grid-template-columns:78px 1fr 58px;gap:7px}.match-stage{display:none}.match-opponent{font-size:10px}.match-score{font-size:15px}.match-personal{grid-column:2/4;text-align:left}.section-head h2{font-size:19px}}
</style>
</head>
<body>
<header class="header"><div class="wrap header-in"><a class="brand" href="/"><small>Кубок России U16</small><strong>Профиль игрока</strong></a><a id="backTeam" class="back" href="/">← К команде</a></div></header>
<main id="app"><div class="loading">Загрузка профиля…</div></main>
<footer class="footer"><div class="wrap">Статистика формируется на основе протоколов и отмеченных составов на матч.</div></footer>
<script>
(()=>{
const API='https://wcucbtdfkghjirpbqzzk.supabase.co/functions/v1/russian-cup';
const FHR='https://wcucbtdfkghjirpbqzzk.supabase.co/functions/v1/russian-cup-fhr-roster';
const q=new URLSearchParams(location.search),TEAM_ID=Number(q.get('team')),NAME=(q.get('name')||'').trim(),NUMBER=q.get('number')||'',POS=q.get('pos')||'';
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=x=>String(x||'').toLocaleLowerCase('ru-RU').replace(/ё/g,'е').replace(/[^a-zа-я0-9]+/gi,' ').replace(/\s+/g,' ').trim();
const displayPos=p=>({G:'Вратарь',D:'Защитник',F:'Нападающий',U:'Игрок'}[p]||p||'Игрок');
const initials=n=>String(n||'').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'—';
async function get(path){const r=await fetch(API+path,{cache:'no-store'});if(!r.ok)throw Error('Ошибка загрузки данных');return r.json()}
function isPhotoStorage(a){return String(a?.name||'').startsWith('__PP_')}
function isLineupStorage(a){return String(a?.name||'').startsWith('__LU_')}
function unpackPhoto(s){s=String(s||'');if(s.startsWith('~0:'))return'https://img.fhr.ru/players/'+s.slice(3);if(s.startsWith('~1:'))return'https://junior.fhr.ru/players/'+s.slice(3);return s}
function chunks(arenas,prefix){return (Array.isArray(arenas)?arenas:[]).filter(a=>String(a?.name||'').startsWith(prefix)).sort((a,b)=>String(a.name).localeCompare(String(b.name))).map(a=>String(a.address||'')).join('')}
function photoMap(arenas){const s=chunks(arenas,'__PP_');if(!s)return{};try{const raw=JSON.parse(s),out={};for(const[k,v]of Object.entries(raw||{}))out[k]=unpackPhoto(v);return out}catch{return{}}}
function lineupMap(arenas){const s=chunks(arenas,'__LU_');if(!s)return{};try{return JSON.parse(s)||{}}catch{return{}}}
function samePlayer(value){const v=clean(value),n=clean(NAME);if(!v||!n)return false;if(v===n)return true;const np=n.split(' '),vp=v.split(' ');if(np[0]&&vp[0]===np[0]&&np[1]&&vp[1]&&vp[1].startsWith(np[1].slice(0,2)))return true;return false}
function isAssist(e){const s=String(e?.assistants||'').trim();if(!s)return false;const parts=s.split(/[,;\/]+/).map(clean).filter(Boolean),n=clean(NAME),surname=n.split(' ')[0],first=n.split(' ')[1]||'';return parts.some(p=>p===n||p===surname||p.startsWith(surname+' '+first.slice(0,2)))}
function eventForPlayer(e){return samePlayer(e?.player)||isAssist(e)}
function matchStats(matchId,events){const list=events.filter(e=>Number(e.match_id)===Number(matchId));const goals=list.filter(e=>e.event_type==='GOAL'&&samePlayer(e.player)).length,assists=list.filter(e=>e.event_type==='GOAL'&&isAssist(e)).length,pim=list.filter(e=>e.event_type==='PENALTY'&&samePlayer(e.player)).reduce((s,e)=>s+(Number(e.penalty_minutes)||0),0);return{g:goals,a:assists,p:goals+assists,pim,hasEvent:list.some(eventForPlayer)}}
function participated(match,team,events){const lu=lineupMap(team?.arenas),names=Array.isArray(lu[String(match.id)])?lu[String(match.id)]:[];return names.some(samePlayer)||matchStats(match.id,events).hasEvent}
function done(m){return Number.isInteger(m.home_score)&&Number.isInteger(m.away_score)}
function stageStats(data,team){const events=Array.isArray(data.match_events)?data.match_events:[],matches=data.matches.filter(m=>[m.home_team_id,m.away_team_id].includes(team.id)),played=matches.filter(m=>participated(m,team,events));return played.reduce((o,m)=>{const s=matchStats(m.id,events);o.gp++;o.g+=s.g;o.a+=s.a;o.p+=s.p;o.pim+=s.pim;return o},{gp:0,g:0,a:0,p:0,pim:0})}
function fmtDate(d){return new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit'})}
function scoreText(m){return done(m)?`${m.home_score}:${m.away_score}`:'—'}
function opponent(m,teamId,data){const oid=Number(m.home_team_id)===Number(teamId)?m.away_team_id:m.home_team_id;return data.teams.find(t=>Number(t.id)===Number(oid))?.name||'—'}
function manualPhoto(team){const map=photoMap(team?.arenas);const exact=Object.entries(map).find(([n])=>clean(n)===clean(NAME));return exact?.[1]||''}
async function autoPhoto(){try{const r=await fetch(FHR+'?team='+TEAM_ID,{cache:'no-store'});if(!r.ok)return'';const b=await r.json(),p=(b.players||[]).find(x=>samePlayer(x.name));return p?.photo||''}catch{return''}}
function renderPhoto(url){const box=$('#playerPhoto');if(!box)return;if(!url){box.innerHTML='<div class="initials">'+esc(initials(NAME))+'</div>';return}const proxy=url.includes('fhr.ru')?FHR+'?photo='+encodeURIComponent(url):url;box.innerHTML='<img src="'+esc(proxy)+'" alt="'+esc(NAME)+'" referrerpolicy="no-referrer">';box.querySelector('img').onerror=()=>box.innerHTML='<div class="initials">'+esc(initials(NAME))+'</div>'}
async function init(){try{
 if(!TEAM_ID||!NAME)throw Error('Игрок не выбран');
 const cat=await get('/api/catalog'),t=cat.tournaments?.[0];if(!t)throw Error('Турнир не найден');
 const stages=(cat.stages||[]).filter(s=>Number(s.tournament_id)===Number(t.id)).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
 const datasets=(await Promise.all(stages.map(async s=>{try{return await get('/api/data?tournament_slug='+encodeURIComponent(t.slug)+'&stage_id='+s.id)}catch{return null}}))).filter(Boolean);
 const first=datasets.find(d=>d.teams?.some(x=>Number(x.id)===TEAM_ID));if(!first)throw Error('Команда не найдена');
 const team=first.teams.find(x=>Number(x.id)===TEAM_ID),rows=datasets.map(d=>({data:d,team:d.teams.find(x=>Number(x.id)===TEAM_ID)})).filter(x=>x.team);
 const per=rows.map(x=>({stage:x.data.stage,stats:stageStats(x.data,x.team)}));
 const total=per.reduce((o,x)=>{for(const k of ['gp','g','a','p','pim'])o[k]+=x.stats[k];return o},{gp:0,g:0,a:0,p:0,pim:0});
 const matches=[];rows.forEach(({data,team})=>{const events=data.match_events||[];data.matches.filter(m=>[m.home_team_id,m.away_team_id].includes(team.id)&&participated(m,team,events)).forEach(m=>matches.push({m,data,team,s:matchStats(m.id,events)}))});matches.sort((a,b)=>String(a.m.game_date).localeCompare(String(b.m.game_date))||(a.m.game_no||0)-(b.m.game_no||0));
 document.title=NAME+' · Кубок России U16';$('#backTeam').href='/team.html?team='+TEAM_ID;
 $('#app').innerHTML=`<section class="hero"><div class="wrap hero-grid"><div id="playerPhoto" class="photo"><div class="initials">${esc(initials(NAME))}</div></div><div><div class="kicker">Кубок России U16</div><h1>${esc(NAME)}</h1><div class="meta"><a class="chip team-link" href="/team.html?team=${TEAM_ID}">${esc(team.name)}</a>${NUMBER?`<span class="chip">№ ${esc(NUMBER)}</span>`:''}${POS?`<span class="chip">${esc(displayPos(POS))}</span>`:''}</div></div></div></section>
 <section class="section"><div class="wrap"><div class="section-head"><h2>Общая статистика</h2><small>Все туры</small></div><div class="stats">${[['gp','И'],['g','Г'],['a','П'],['p','О'],['pim','Штр']].map(([k,l])=>`<div class="stat"><strong>${total[k]}</strong><span>${l}</span></div>`).join('')}</div></div></section>
 <section class="section"><div class="wrap"><div class="section-head"><h2>По турам</h2><small>${per.length} ${per.length===1?'тур':'тура'}</small></div><div class="stage-list">${per.length?per.map(x=>`<div class="stage-row"><div class="stage-name"><strong>${esc(x.stage?.name||'Тур')}</strong><span>${x.stats.gp?x.stats.gp+' матч.':'участие не отмечено'}</span></div>${[['gp','И'],['g','Г'],['a','П'],['p','О'],['pim','Штр']].map(([k,l])=>`<div class="stage-cell"><strong>${x.stats[k]}</strong><span>${l}</span></div>`).join('')}</div>`).join(''):'<div class="empty">Данных по турам пока нет</div>'}</div></div></section>
 <section class="section"><div class="wrap"><div class="section-head"><h2>Матчи игрока</h2><small>${matches.length} матч.</small></div><div class="matches">${matches.length?matches.map(x=>`<a class="match" href="/?t=${encodeURIComponent(t.slug)}&stage=${x.data.stage.id}&match=${x.m.id}"><div class="match-date">${fmtDate(x.m.game_date)}</div><div class="match-stage">${esc(x.data.stage?.name||'')}</div><div class="match-opponent">vs ${esc(opponent(x.m,TEAM_ID,x.data))}</div><div class="match-score">${scoreText(x.m)}</div><div class="match-personal">Г <strong>${x.s.g}</strong> · П <strong>${x.s.a}</strong> · О <strong>${x.s.p}</strong>${x.s.pim?` · Штр <strong>${x.s.pim}</strong>`:''}</div></a>`).join(''):'<div class="empty">Пока нет матчей с подтверждённым участием игрока.</div>'}</div><div class="note">Матч учитывается, если игрок отмечен в составе на матч или имеет событие в протоколе (гол, передача, штраф).</div></div></section>`;
 const photo=manualPhoto(team)||await autoPhoto();renderPhoto(photo);
 }catch(e){$('#app').innerHTML='<div class="loading error">'+esc(e.message||String(e))+'</div>'}}
init();
})();
</script>
</body>
</html>
