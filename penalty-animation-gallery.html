<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Каталог анимаций удалений · Кубок России U16</title>
<style>
:root{--bg:#06111d;--panel:#0c1d30;--line:rgba(139,190,226,.16);--text:#f4f8fb;--muted:#8ea4b9;--red:#e31f2b}
*{box-sizing:border-box}html{scroll-behavior:smooth}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 72% 2%,rgba(35,135,217,.12),transparent 30%),linear-gradient(180deg,#06111d,#081522);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}button{font:inherit}.wrap{width:min(1040px,calc(100% - 28px));margin:0 auto;padding:42px 0 80px}.kicker{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7dbbe4;font-weight:900}.title{margin:8px 0 8px;font-size:clamp(32px,5vw,54px);letter-spacing:-.045em;line-height:1}.sub{margin:0;color:var(--muted);font-size:13px;line-height:1.55;max-width:780px}.toolbar{position:sticky;top:0;z-index:50;display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 24px;padding:10px;border:1px solid var(--line);background:rgba(4,15,25,.88);backdrop-filter:blur(14px);border-radius:12px}.filter{border:1px solid rgba(139,190,226,.16);background:#0b1b2d;color:#b9c8d7;border-radius:8px;padding:9px 12px;font-weight:850;font-size:11px;cursor:pointer}.filter.active{background:var(--red);border-color:var(--red);color:#fff}.team-block{margin:0 0 26px}.team-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid rgba(139,190,226,.12)}.team-head img{width:44px;height:44px;object-fit:contain;filter:drop-shadow(0 7px 12px rgba(0,0,0,.22))}.team-head h2{margin:0;font-size:20px;line-height:1.1}.team-head small{display:block;margin-top:4px;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.09em}.cards{display:grid;gap:10px}.event{position:relative;display:grid;grid-template-columns:92px 58px minmax(0,1fr) auto;gap:16px;align-items:center;min-height:122px;padding:18px 20px;border:1px solid rgba(139,190,226,.14);border-radius:14px;background:linear-gradient(180deg,rgba(18,40,64,.96),rgba(8,24,40,.98));overflow:hidden;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:border-color .18s ease,transform .18s ease}.event:hover{border-color:rgba(139,190,226,.28);transform:translateY(-1px)}.time strong{display:block;font-size:22px;line-height:1;font-weight:950;letter-spacing:-.03em}.time span{display:block;margin-top:7px;font-size:9px;text-transform:uppercase;letter-spacing:.09em;color:#8095aa}.logo{width:52px;height:52px;object-fit:contain;filter:drop-shadow(0 8px 14px rgba(0,0,0,.25))}.main{display:flex;gap:13px;align-items:center;min-width:0}.avatar{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:#102844;border:1px solid rgba(255,255,255,.08);font-size:13px;font-weight:950;color:#9ec8e5;flex:0 0 auto}.copy{min-width:0}.label{display:flex;align-items:center;gap:7px;color:#ff6671;font-size:10px;font-weight:950;letter-spacing:.11em;text-transform:uppercase;margin-bottom:5px}.label svg{width:21px;height:21px}.copy strong{display:block;font-size:16px;line-height:1.2}.copy p{margin:6px 0 0;color:#93a8bc;font-size:11px;line-height:1.45}.mins{font-size:13px;font-weight:950;color:#fff;white-space:nowrap}
.penalty-layer{position:absolute;inset:0;z-index:20;background:var(--red);color:#fff;overflow:hidden;clip-path:inset(0 100% 0 0);pointer-events:none;will-change:clip-path,transform}.penalty-layer-inner{position:absolute;inset:0;display:grid;align-items:center;padding:0 32px}.penalty-phase-b{grid-template-columns:auto minmax(0,1fr);gap:24px;justify-content:center;background:var(--red)}.penalty-cover{position:absolute;inset:0;z-index:2;background:var(--red);overflow:hidden;clip-path:inset(0 0 0 0);will-change:clip-path}.penalty-phase-a{grid-template-columns:72px minmax(0,1fr) 92px;gap:20px}.whistle{width:52px;height:52px;display:grid;place-items:center}.whistle svg{width:52px;height:52px;display:block}.penalty-word{font-size:clamp(30px,5vw,58px);font-weight:1000;letter-spacing:-.045em;text-transform:uppercase;white-space:nowrap}.penalty-team-logo{width:78px;height:78px;object-fit:contain;justify-self:end;filter:drop-shadow(0 10px 20px rgba(0,0,0,.24))}.penalty-minutes{font-size:clamp(44px,6.5vw,78px);line-height:.8;font-weight:1000;letter-spacing:-.06em;white-space:nowrap}.penalty-reason{font-size:clamp(22px,3.7vw,46px);font-weight:1000;letter-spacing:-.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.penalty-reason.long{font-size:clamp(18px,3vw,36px)}.penalty-reason.very-long{font-size:clamp(15px,2.45vw,29px)}
.penalty-playing>:not(.penalty-layer){animation:underCard 5.8s linear both}.penalty-playing .penalty-layer{animation:penaltyOuter 5.8s cubic-bezier(.65,0,.35,1) both}.penalty-playing .penalty-cover{animation:penaltyReverse 5.8s cubic-bezier(.65,0,.35,1) both}@keyframes underCard{0%,73%{opacity:0}74%,100%{opacity:1}}@keyframes penaltyOuter{0%,4%{clip-path:inset(0 100% 0 0);transform:translateY(0)}24%,74%{clip-path:inset(0 0 0 0);transform:translateY(0)}100%{clip-path:inset(0 0 0 0);transform:translateY(-102%)}}@keyframes penaltyReverse{0%,38%{clip-path:inset(0 0 0 0)}63%,100%{clip-path:inset(0 100% 0 0)}}.penalty-cover:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 0 38%,rgba(255,255,255,.12) 48%,transparent 58%);transform:translateX(-120%)}.penalty-playing .penalty-cover:after{animation:glint 5.8s ease both}@keyframes glint{0%,10%{transform:translateX(-120%)}31%{transform:translateX(120%)}100%{transform:translateX(120%)}}
.hidden{display:none!important}.top-link{display:inline-block;margin-top:10px;color:#7dbbe4;font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.08em}
@media(max-width:700px){.wrap{padding-top:26px}.toolbar{top:0;margin-top:18px}.team-head img{width:38px;height:38px}.team-head h2{font-size:17px}.event{grid-template-columns:58px 40px minmax(0,1fr);gap:9px;min-height:106px;padding:14px 11px}.time strong{font-size:17px}.logo{width:38px;height:38px}.avatar{display:none}.copy strong{font-size:14px}.copy p{font-size:10px}.mins{grid-column:3;justify-self:start;margin-top:-8px}.penalty-layer-inner{padding:0 14px}.penalty-phase-a{grid-template-columns:42px minmax(0,1fr) 52px;gap:8px}.whistle,.whistle svg{width:36px;height:36px}.penalty-team-logo{width:48px;height:48px}.penalty-word{font-size:clamp(20px,8vw,34px)}.penalty-phase-b{grid-template-columns:auto minmax(0,1fr);gap:9px}.penalty-minutes{font-size:34px}.penalty-reason{font-size:clamp(17px,5.3vw,26px)}.penalty-reason.long{font-size:clamp(15px,4.6vw,22px)}.penalty-reason.very-long{font-size:clamp(13px,3.9vw,19px)}}
@media(prefers-reduced-motion:reduce){.penalty-playing .penalty-layer,.penalty-playing .penalty-cover,.penalty-playing>:not(.penalty-layer){animation-duration:.01ms!important}}
</style>
</head>
<body>
<main class="wrap" id="top">
 <div class="kicker">Тест · Матч-центр</div>
 <h1 class="title">Все анимации удалений</h1>
 <p class="sub">20 команд · по три варианта на каждую: 2′, 5+20′ и 2+2′. Причины специально разные, чтобы проверить короткие и длинные формулировки. Нажми на любую карточку — анимация перезапустится.</p>
 <div class="toolbar" id="filters"><button class="filter active" data-filter="all">Все</button><button class="filter" data-filter="2">2′</button><button class="filter" data-filter="5+20">5+20′</button><button class="filter" data-filter="2+2">2+2′</button></div>
 <div id="gallery"></div>
 <a class="top-link" href="#top">↑ Наверх</a>
</main>
<script src="/team-branding.js?v=20260909-1"></script>
<script>
(()=>{
 const minor=['Блокировка','Подножка','Задержка соперника','Задержка клюшкой','Удар клюшкой','Высоко поднятая клюшка','Толчок соперника на борт','Атака игрока без шайбы','Задержка игры','Нарушение численного состава'];
 const major=['Толчок соперника на борт','Атака в область головы и шеи','Колющий удар','Удар соперника клюшкой','Грубость','Атака сзади'];
 const dbl=['Высоко поднятая клюшка','Грубость','Удар клюшкой','Неспортивное поведение'];
 const whistle=`<svg viewBox="0 0 64 64"><circle cx="22" cy="40" r="11" fill="none" stroke="currentColor" stroke-width="5"/><path d="M31 34h15c5 0 9 4 9 9s-4 9-9 9H31M27 30l9-16 8 4-7 13M43 16l7-7" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
 const smallWhistle=`<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8.2" cy="15.4" r="4.1" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M11.7 13.2h5.8c1.6 0 2.8 1.2 2.8 2.7s-1.2 2.7-2.8 2.7h-5.7M10.3 11.9l3-4.8 2 1.2-2.3 3.8M15.1 7.7l2.2-2.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
 const teams=window.RussianCupTeamBranding?.teams||[];
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function reasonClass(s){return s.length>31?'very-long':s.length>20?'long':''}
 function card(team,variant,reason,idx){const p=variant==='2'?'2 мин.':variant==='5+20'?'5+20 мин.':'2+2 мин.';const display=variant==='2'?'2′':variant==='5+20'?'5+20′':'2+2′';const no=String((idx*7)%89+10);return `<article class="event" data-variant="${variant}" role="button" tabindex="0" aria-label="Проиграть анимацию удаления ${esc(team.name)} ${display}"><div class="time"><strong>${String(6+(idx%13)).padStart(2,'0')}:${String(11+(idx*3)%48).padStart(2,'0')}</strong><span>${1+(idx%3)} период</span></div><img class="logo" src="${esc(team.logo)}" alt="Логотип ${esc(team.name)}"><div class="main"><div class="avatar">${no}</div><div class="copy"><div class="label">${smallWhistle}Удаление</div><strong>№${no} Тестовый игрок</strong><p>${esc(reason)} · ${esc(team.name)}</p></div></div><div class="mins">${p}</div><div class="penalty-layer" aria-hidden="true"><div class="penalty-layer-inner penalty-phase-b"><div class="penalty-minutes">${display}</div><div class="penalty-reason ${reasonClass(reason)}" title="${esc(reason)}">${esc(reason)}</div></div><div class="penalty-cover"><div class="penalty-layer-inner penalty-phase-a"><div class="whistle">${whistle}</div><div class="penalty-word">Удаление</div><img class="penalty-team-logo" src="${esc(team.logo)}" alt=""></div></div></div></article>`}
 const gallery=document.getElementById('gallery');
 gallery.innerHTML=teams.map((t,i)=>{const items=[['2',minor[i%minor.length]],['5+20',major[i%major.length]],['2+2',dbl[i%dbl.length]]];return `<section class="team-block" data-team="${esc(t.name)}"><div class="team-head"><img src="${esc(t.logo)}" alt=""><div><h2>${esc(t.name)}</h2><small>2′ · 5+20′ · 2+2′</small></div></div><div class="cards">${items.map((x,j)=>card(t,x[0],x[1],i*3+j)).join('')}</div></section>`}).join('');
 let timerMap=new WeakMap();
 function play(card){clearTimeout(timerMap.get(card));card.classList.remove('penalty-playing');void card.offsetWidth;card.classList.add('penalty-playing');timerMap.set(card,setTimeout(()=>card.classList.remove('penalty-playing'),5950))}
 gallery.addEventListener('pointerup',e=>{const card=e.target.closest('.event');if(card)play(card)});
 gallery.addEventListener('keydown',e=>{const card=e.target.closest('.event');if(card&&(e.key==='Enter'||e.key===' ')){e.preventDefault();play(card)}});
 document.getElementById('filters').addEventListener('click',e=>{const b=e.target.closest('.filter');if(!b)return;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));const f=b.dataset.filter;document.querySelectorAll('.event').forEach(c=>c.classList.toggle('hidden',f!=='all'&&c.dataset.variant!==f));document.querySelectorAll('.team-block').forEach(s=>s.classList.toggle('hidden',![...s.querySelectorAll('.event')].some(c=>!c.classList.contains('hidden'))))});
})();
</script>
</body>
</html>
